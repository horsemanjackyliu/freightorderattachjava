_schema-version: 3.3.0
ID: freightorderattachjava
version: 1.0.0-SNAPSHOT
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
modules:
  - name: freightorderattachjava-srv
    type: java
    path: srv
    parameters:
      instances: 1
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud,sandbox
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
      REPOSITORY_ID: f0053c1c-3c16-4517-8b0c-990db8724404
      INCOMING_CONNECTION_TIMEOUT: 3600000
      INCOMING_REQUEST_TIMEOUT: 3600000
      INCOMING_SESSION_TIMEOUT: 3600000
      timeout: 3600000
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: freightorderattachjava-db
      - name: freightorderattachjava-auth
      - name: freightorderattachjava-sdm
      - name: freightorderattachjava-destination
      - name: freightorderattachjava-messaging   

  - name: freightorderattachjava-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: freightorderattachjava-db

  - name: freightorderattachjava-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: freightorderattachjava-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: freightorderattachjavafreightorderattachjavaui5
          artifacts:
            - freightorderattachjavaui5.zip
          target-path: resources

  - name: freightorderattachjavafreightorderattachjavaui5
    type: html5
    path: app/freightorderattachjavaui5
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: freightorderattachjava-destinations
    type: com.sap.application.content
    requires:
      - name: freightorderattachjava-auth
        parameters:
          service-key:
            name: freightorderattachjava-auth-key
      - name: freightorderattachjava-html5-repo-host
        parameters:
          service-key:
            name: freightorderattachjava-html5-repo-host-key
      - name: srv-api
      - name: freightorderattachjava-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: freightorderattachjava-html5-repository
              ServiceInstanceName: freightorderattachjava-html5-repo-host
              ServiceKeyName: freightorderattachjava-html5-repo-host-key
              sap.cloud.service: freightorderattachjava.service
            - Name: freightorderattachjava-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: freightorderattachjava-auth
              ServiceKeyName: freightorderattachjava-auth-key
              sap.cloud.service: freightorderattachjava.service

resources:
  - name: freightorderattachjava-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: freightorderattachjava-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: freightorderattachjava-${org}-${space}
        tenant-mode: dedicated
  - name: freightorderattachjava-sdm
    type: org.cloudfoundry.managed-service
    parameters:
      service: sdm
      service-plan: standard
  - name: freightorderattachjava-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: freightorderattachjava-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

  - name: freightorderattachjava-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: freightorderattachjava-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: freightorderattachjava-messaging
    type: org.cloudfoundry.managed-service
    parameters:
      service: enterprise-messaging
      service-plan: default
      path: ./event-mesh.json
